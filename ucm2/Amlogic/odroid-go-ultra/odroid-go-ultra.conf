Syntax 3

# Hardkernel ODROID-GO Ultra (S922X): axg-sound-card, FRDDR_A -> TDMOUT_B -> TDM-B (I2S) -> the RK817
# codec. The RK817's "Playback Mux" chooses its output: SPK is its own class-D output (SPKO), which
# drives the mono speaker; HP is the headphone jack (HPOL/HPOR).

SectionUseCase."HiFi" {
	File "/Amlogic/odroid-go-ultra/HiFi.conf"
	Comment "Play HiFi quality Music"
}

BootSequence [
	cset "name='FRDDR_A SINK 1 SEL' 1"
	cset "name='FRDDR_A SRC 1 EN Switch' off"
	cset "name='TDMOUT_B SRC SEL' 0"
	cset "name='Playback Mux' 1"
]
