# ODROID-GO Ultra HiFi: FRDDR_A's output 1 feeds TDMOUT_B input 0 (the DT's audio-routing), TDMOUT_B
# drives TDM-B to the RK817. Speaker and headphones share the codec's "Playback Mux" (0 HP, 1 SPK),
# so they conflict. The headphone jack switch is a gpio-keys input (SW_HEADPHONE_INSERT), not an
# ALSA jack control, so the speaker has the higher priority and the headphones are chosen by hand.

SectionVerb {
	EnableSequence [
		cset "name='FRDDR_A SINK 1 SEL' 1"
		cset "name='FRDDR_A SRC 1 EN Switch' on"
		cset "name='TDMOUT_B SRC SEL' 0"
	]
	DisableSequence [
		cset "name='FRDDR_A SRC 1 EN Switch' off"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"
	ConflictingDevice [
		"Headphones"
	]
	EnableSequence [
		cset "name='Playback Mux' 1"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixerElem "Master"
		PlaybackVolume "Master Playback Volume"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	ConflictingDevice [
		"Speaker"
	]
	EnableSequence [
		cset "name='Playback Mux' 0"
	]
	DisableSequence [
		cset "name='Playback Mux' 1"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixerElem "Master"
		PlaybackVolume "Master Playback Volume"
	}
}
