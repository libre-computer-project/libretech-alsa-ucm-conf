# HiFi verb: analog playback devices for the Genio 510 EVK SOF card.
#
# Headphones and Speaker both play out the SOF analog DL front-end
# (hw:${CardId},${var:PlayDevN} == hw:<card>,16) via the route established
# by init.conf's BootSequence; the per-device sequence picks the MT6359
# output mux (HP Mux for headphone, LOL Mux for lineout).

SectionVerb {
	EnableSequence [
		disdevall ""
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphone / headset earphone (MT6359 HPL/HPR)"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		# AFE matrix: SOF_DL2 memif (I070/I071) -> ADDA DL (O176/O177)
		cset "name='O176 I070 Switch' on"
		cset "name='O177 I071 Switch' on"
		cset "name='DL_GAIN_MUX' Bypass"
		# MT6359: normal DAC path (AIF_RX), not the sine generator
		cset "name='DAC In Mux' Normal Path"
		cset "name='Headset Volume' 8"
		# DACL/DACR -> Headphone L/R
		cset "name='HP Mux' Audio Playback"
		# gate the card "Headphone" output endpoint widget
		cset "name='Headphone Switch' on"
	]

	DisableSequence [
		cset "name='HP Mux' Open"
		cset "name='Headphone Switch' off"
		cset "name='O176 I070 Switch' off"
		cset "name='O177 I071 Switch' off"
	]

	Value {
		PlaybackPriority 500
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},${var:PlayDevN}"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Speaker" {
	Comment "Lineout (MT6359 LOL)"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		# AFE matrix: SOF_DL2 memif (I070/I071) -> ADDA DL (O176/O177)
		cset "name='O176 I070 Switch' on"
		cset "name='O177 I071 Switch' on"
		cset "name='DL_GAIN_MUX' Bypass"
		cset "name='DAC In Mux' Normal Path"
		cset "name='Lineout Volume' 8"
		# DAC -> LINEOUT L
		cset "name='LOL Mux' Playback"
	]

	DisableSequence [
		cset "name='LOL Mux' Open"
		cset "name='O176 I070 Switch' off"
		cset "name='O177 I071 Switch' off"
	]

	Value {
		PlaybackPriority 400
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},${var:PlayDevN}"
	}
}
