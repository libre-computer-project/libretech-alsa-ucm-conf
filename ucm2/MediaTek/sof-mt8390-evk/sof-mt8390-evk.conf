# UCM2 profile for the Genio 510 EVK (MT8188 / mt8390) SOF audio card.
#
# Enables analog playback: the SOF analog downlink (DL) front-end ->
# AFE connection matrix -> ADDA back-end -> MT6359 Headphone/Lineout.
# Without it, a bare aplay/speaker-test on the analog FE returns -22
# ("no backend DAIs enabled for DL<n>_FE ... missing ALSA mixer-based
# routing or UCM profile"): nothing connects the FE to the MT6359 BE in
# DAPM.
#
# This is the shared profile body; the conf.d/<match>/<match>.conf entries
# (keyed by the card driver field "sof-mt8390-evk" and the platform driver
# "mt8188_mt6359") include it.

Syntax 4

Define {
	# Analog playback PCM device index.  16 == "SOF_DL2", the SOF-DSP
	# analog DL front-end -- the FE that throws the -22 this clears.
	# (The direct "DL6 Playback" dev 2 is NOT userspace-usable for analog
	# out: DL6_FE -> DL_SRC_BE fails -22 on an atomic/nonatomic FE/BE
	# mismatch, a kernel-config issue, not mixer state.)
	PlayDevN "16"
	# SOF analog capture FE.
	CapDevN  "18"
	CapChanN "2"
}

SectionUseCase."HiFi" {
	File "/MediaTek/sof-mt8390-evk/HiFi.conf"
	Comment "Play high quality music"
}

Include.init.File "/MediaTek/sof-mt8390-evk/init.conf"
