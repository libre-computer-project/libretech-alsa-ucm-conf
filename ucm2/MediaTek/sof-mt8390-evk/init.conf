# Boot-time defaults for the MT6359 analog playback path.
#
# NOTE: the full AFE connection-matrix route (O176/O177 I070/I071 Switch,
# DL_GAIN_MUX, DAC In Mux) lives in each device's EnableSequence in
# HiFi.conf, NOT here. On alsa-lib 1.2.14 (the board's version) a
# BootSequence inside an Include'd init.conf does NOT fire on
# `set _verb` -- only SectionVerb/SectionDevice EnableSequences run. The
# device EnableSequence is the proven path (verified: route set + no -22 +
# MT6359 Headphone/Lineout DAPM On). This BootSequence carries only the
# codec-side defaults that are safe to set unconditionally; it is kept for
# alsa-lib builds where it does run, and is harmless where it does not.
#
# Full route (established by the device EnableSequence):
#   SOF_DMA_DL2 -> I070/I071 -> (O176/O177 I070/I071 Switch) -> O176/O177
#               -> DL_GAIN_MUX (Bypass) -> ADDA Playback (DL_SRC BE)
#               -> AIF1 Playback -> MT6359 AIF_RX -> (DAC In Mux=Normal Path)
#               -> DACL/DACR -> [HP Mux | LOL Mux] -> Headphone | Lineout

BootSequence [
	# MT6359: normal DAC path (AIF_RX), not the internal sine generator
	cset "name='DAC In Mux' Normal Path"
	# sane analog gains (un-mute); index range 0..18, ~0 dB near the top
	cset "name='Headset Volume' 8"
	cset "name='Lineout Volume' 8"
]
