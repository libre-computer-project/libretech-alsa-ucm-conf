# MT8183 Kukui / Jacuzzi (Fennel) -- DA7219 headphone codec + RT1015P speaker amp, one I2S3 bus.
#
# Playback_1 (hw:N,0, AFE DL1) is the only playback FE, and DL1 -> I2S3 is its only BE route: the
# RT1015P and the DA7219 both sit on I2S3, so Speaker and Headphones share the PCM AND the route.
# The route is therefore set in the verb and never cleared by a device. PipeWire's ACP puts two
# devices that share a PCM into separate profiles, and on a profile switch it opens the new
# device's PCM before that device's EnableSequence runs: a device DisableSequence that clears
# 'I2S3_CHn DL1_CHn' leaves the FE with no BE, the open fails -EINVAL and the sink is never made
# (upstream alsa-ucm-conf 1.2.14's profile does exactly that). What tells the two outputs apart is
# the RT1015P's pin switch ('Speakers Switch') and the DA7219's headphone switches.
#
# JackControl lets WirePlumber choose: with no headphones in, the Headphones device is unavailable
# and the Speaker profile is the one picked (without it every route is "unknown" and the higher
# priority, Headphones, wins even with nothing plugged in).

SectionVerb {
	EnableSequence [
		cset "name='I2S3_CH1 DL1_CH1' 1"
		cset "name='I2S3_CH2 DL1_CH2' 1"
		cset "name='UL3_CH1 ADDA_UL_CH1' 1"
		cset "name='UL3_CH2 ADDA_UL_CH2' 1"
	]
}

SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Headphones"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 100
	}
	EnableSequence [
		cset "name='Speakers Switch' 1"
	]
	DisableSequence [
		cset "name='Speakers Switch' 0"
	]
}

SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Speaker"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 200
		JackControl "Headphones Jack"
	}
	EnableSequence [
		cset "name='Playback Digital Switch' 1"
		cset "name='Headphone Switch' 1"
		cset "name='ST Mixer Out FilterL Out FilterL Switch' 1"
		cset "name='Mixer Out FilterL DACL Switch' 1"
		cset "name='ST Mixer Out FilterR Out FilterR Switch' 1"
		cset "name='Mixer Out FilterR DACR Switch' 1"
		cset "name='Out DACL Mux' DAIL"
		cset "name='Out DACR Mux' DAIR"
	]
	DisableSequence [
		cset "name='Playback Digital Switch' 0"
		cset "name='Headphone Switch' 0"
		cset "name='ST Mixer Out FilterL Out FilterL Switch' 0"
		cset "name='Mixer Out FilterL DACL Switch' 0"
		cset "name='ST Mixer Out FilterR Out FilterR Switch' 0"
		cset "name='Mixer Out FilterR DACR Switch' 0"
	]
}

# Capture_3 (hw:N,5, AFE UL3) is shared the same way: the MT6358 DMIC reaches it through ADDA_UL,
# the DA7219 headset ADC through I2S2. The ADDA_UL route stays set by the verb so UL3 always has a
# BE; the headset adds its I2S2 route and the DMIC is switched at the MT6358.
SectionDevice."Mic" {
	Comment "Internal Microphone"

	ConflictingDevice [
		"Headset"
	]

	Value {
		CapturePCM "hw:${CardId},5"
		CapturePriority 100
	}
	EnableSequence [
		cset "name='MTKAIF_DMIC' 1"
		cset "name='Mt6358 Mic Type Mux' 2"
	]
	DisableSequence [
		cset "name='Mt6358 Mic Type Mux' 0"
	]
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Mic"
	]

	Value {
		CapturePCM "hw:${CardId},5"
		CapturePriority 200
		JackControl "Headset Mic Jack"
	}
	EnableSequence [
		cset "name='Capture Digital Switch' 1"
		cset "name='Mixin Switch' 1"
		cset "name='Mic Switch' 1"
		cset "name='Mixer In Mic Switch' 1"
		cset "name='Out DAIL Mux' ADC"
		cset "name='UL3_CH1 I2S2_CH1' 1"
	]
	DisableSequence [
		cset "name='Capture Digital Switch' 0"
		cset "name='Mixin Switch' 0"
		cset "name='Mic Switch' 0"
		cset "name='Mixer In Mic Switch' 0"
		cset "name='UL3_CH1 I2S2_CH1' 0"
	]
}
