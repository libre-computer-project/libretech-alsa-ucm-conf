# Boot-time codec defaults for the i500 MT6358 internal codec.
#
# NOTE: the full AFE connection-matrix route (ADDA_DL_CH* / UL2_CH* switches)
# plus the MT6358 output/input muxes live in each device's EnableSequence in
# HiFi.conf, NOT here. On alsa-lib 1.2.x a BootSequence inside an Include'd
# init.conf does NOT fire on `set _verb` -- only SectionVerb/SectionDevice
# EnableSequences run (observed on the sof-mt8390-evk bring-up, alsa-lib
# 1.2.14). This BootSequence carries only codec-side defaults that are safe to
# set unconditionally; it is kept for alsa-lib builds where it does run and is
# harmless where it does not.
#
# Every control name below is verified against the kernel source:
#   'DAC In Mux'      sound/soc/codecs/mt6358.c:2027 (enum:632-634 Normal Path/Sgen)
#   'Headphone Volume' sound/soc/codecs/mt6358.c:513 (range 0..0x12, inverted)
#   'Lineout Volume'   sound/soc/codecs/mt6358.c:516 (range 0..0x12, inverted)
# The MT6358 component carries NO name_prefix on this card (the "Mt6358 "
# prefix used by the mt8183_da7219 Chromebook UCM comes from THAT machine
# driver's codec_conf, mt8183-da7219-max98357.c:615-618; mt8183_mt6358_card
# sets no codec_conf, so the controls are un-prefixed here).

BootSequence [
	# MT6358: normal DAC path (AIF_RX), not the internal sine generator.
	cset "name='DAC In Mux' Normal Path"
	# Sane analog playback gains.  Index 0..0x12 (0x12==max); playback_tlv =
	# -10 dB at 0, +1 dB/step -> 10 ~= 0 dB.  Inverted control.
	cset "name='Headphone Volume' 10"
	cset "name='Lineout Volume' 10"
]
