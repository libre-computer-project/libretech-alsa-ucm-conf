# UCM2 profile for the Genio 500 / i500 (MT8183 / MT8385) bare MT6358
# internal-codec ALSA card.
#
# Card name (snd_soc_card.name):        mt8183_mt6358
# Card driver field (snd_ctl_card_info.driver, sanitized card name): mt8183_mt6358
# Platform driver (sysfs device/driver): mt8183_mt6358_ts3a227
# DT compatible:                        mediatek,mt8183-mt6358-sound
#   -> mt8183_mt6358_card in
#      sound/soc/mediatek/mt8183/mt8183-mt6358-ts3a227-max98357.c
#
# The mt8183_mt6358_card struct sets NO .controls / .dapm_widgets /
# .dapm_routes, and the i500 DTS sound node sets no audio-routing /
# sound-name-prefix property, so nothing connects the DL/UL front-ends to the
# MT6358 back-end in DAPM. A bare aplay/arecord on a FE therefore returns -22
# ("no backend DAIs enabled for <FE> ... missing ALSA mixer-based routing or
# UCM profile"). This profile encodes that route as the per-device
# EnableSequence (the AFE connection-matrix switches + the MT6358 output/input
# muxes).
#
# This is the shared profile body; the conf.d/<match>/<match>.conf entries
# (keyed by the card driver field "mt8183_mt6358" and the platform driver
# "mt8183_mt6358_ts3a227") include it.

Syntax 4

Define {
	# Playback PCM device index.  Device 0 == "Playback_1" (cpu DAI "DL1"),
	# the first FE in mt8183_mt6358_dai_links (Playback_1, Playback_3,
	# Capture_2, Capture_3, Capture_Mono_1; the BE "Primary Codec" has
	# no_pcm=1 so it gets no PCM device).
	PlayDevN "0"
	# Capture PCM device index.  Device 2 == "Capture_2" (cpu DAI "UL2").
	CapDevN  "2"
	CapChanN "2"
}

SectionUseCase."HiFi" {
	File "/MediaTek/mt8183_mt6358/HiFi.conf"
	Comment "Play high quality music"
}

Include.init.File "/MediaTek/mt8183_mt6358/init.conf"
