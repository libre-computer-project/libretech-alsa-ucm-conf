# HiFi verb: analog playback + capture for the i500 bare MT6358 card.
#
# Playback FE  = "Playback_1" (cpu DAI DL1) = hw:${CardId},${var:PlayDevN} (dev 0)
# Capture  FE  = "Capture_2"  (cpu DAI UL2) = hw:${CardId},${var:CapDevN}  (dev 2)
# BE           = "Primary Codec" (cpu DAI ADDA <-> mt6358-snd-codec-aif1)
#
# Route lit by each device's EnableSequence (traced from kernel source on
# linux-6.18.y-lc; file:line cites in the per-cset comments):
#
#   Playback (Headphones / Speaker):
#     DL1 --[ADDA_DL_CH1 DL1_CH1 / ADDA_DL_CH2 DL1_CH2]--> ADDA_DL_CH1/CH2
#         --> "ADDA Playback" (BE) --> MT6358 AIF_RX
#         --[DAC In Mux=Normal Path]--> DACL/DACR
#         --[HPL/HPR Mux=Audio Playback]--> Headphone L/R   (Headphones)
#         --[LOL Mux=Playback]--> LOL Buffer --> LINEOUT L  (Speaker)
#
#   Capture (Mic, analog ACC path):
#     AINx --[PGA L/R Mux]--> PGA L/R --[ADC L/R Mux=Preamplifier]--> ADC L/R
#         --[Mic Type Mux=ACC]--> AIF Out Mux --> AIF1TX --> "ADDA Capture" (BE)
#         --[UL2_CH1 ADDA_UL_CH1 / UL2_CH2 ADDA_UL_CH2]--> UL2 (FE)
#
# Control-name sources (all verified present in the kernel tree):
#   AFE DL switch  'ADDA_DL_CH1 DL1_CH1' / 'ADDA_DL_CH2 DL1_CH2'
#     mt8183-dai-adda.c:24,39 (mixers ADDA_DL_CH1/CH2) + routes :187-189
#   AFE UL switch  'UL2_CH1 ADDA_UL_CH1' / 'UL2_CH2 ADDA_UL_CH2'
#     mt8183-afe-pcm.c:372-375 (mixers) + routes :401-404
#   AFE dmic gate  'MTKAIF_DMIC'              mt8183-dai-adda.c:145
#   MT6358 'DAC In Mux'  (Normal Path/Sgen)  mt6358.c:2027 / enum :632
#   MT6358 'HPL Mux'/'HPR Mux' (Open/LoudSPK Playback/Audio Playback/...)
#                                            mt6358.c:2043,2049 / enum :565
#   MT6358 'LOL Mux'  (Open/Mute/Playback/Test Mode)  mt6358.c:2034 / enum :537
#   MT6358 'Mic Type Mux' (Idle/ACC/DMIC/DCC/...)     mt6358.c:2098 / enum :676
#   MT6358 'ADC L Mux'/'ADC R Mux' (Idle/AIN0/<L|R> Preamplifier/Idle_1)
#                                            mt6358.c:2104,2108 / enum :713,735
#   MT6358 'PGA L Mux'/'PGA R Mux' (None/AIN0/AIN1/AIN2) mt6358.c:2116,2120 / enum :758
#   MT6358 'Headphone Volume'/'Lineout Volume'/'PGA Volume' mt6358.c:513,516,523
#
# BOARD-UNVERIFIED (flagged, not guessed): the OLogic Pumpkin i500 has no public
# schematic and the DTS sound node comments "no external amp/jack". Whether the
# MT6358 Headphone / LINEOUT pins reach a physical jack, and which analog input
# (AIN0/AIN1/AIN2) the mic is wired to, are NOT confirmed from any source we
# hold. The capture device below assumes the analog ACC mic on AIN0(L)/AIN1(R);
# if the board uses a digital mic, switch to the DMIC variant noted inline.
# All CONTROL NAMES are real; only the physical AIN choice + jack presence are
# board facts to confirm on hardware. Acoustic output/input is bench-gated.

SectionVerb {
	EnableSequence [
		disdevall ""
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphone out (MT6358 HPL/HPR)"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		# AFE matrix: DL1 memif -> ADDA DL L/R mixers
		cset "name='ADDA_DL_CH1 DL1_CH1' 1"
		cset "name='ADDA_DL_CH2 DL1_CH2' 1"
		# MT6358: normal DAC path (AIF_RX), not the sine generator
		cset "name='DAC In Mux' Normal Path"
		cset "name='Headphone Volume' 10"
		# DACL/DACR -> Headphone L/R
		cset "name='HPL Mux' Audio Playback"
		cset "name='HPR Mux' Audio Playback"
	]

	DisableSequence [
		cset "name='HPL Mux' Open"
		cset "name='HPR Mux' Open"
		cset "name='ADDA_DL_CH1 DL1_CH1' 0"
		cset "name='ADDA_DL_CH2 DL1_CH2' 0"
	]

	Value {
		PlaybackPriority 500
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},${var:PlayDevN}"
	}
}

SectionDevice."Speaker" {
	Comment "Line out (MT6358 LOL -> LINEOUT L)"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		# AFE matrix: DL1 memif -> ADDA DL L/R mixers
		cset "name='ADDA_DL_CH1 DL1_CH1' 1"
		cset "name='ADDA_DL_CH2 DL1_CH2' 1"
		cset "name='DAC In Mux' Normal Path"
		cset "name='Lineout Volume' 10"
		# DACL -> LOL Buffer -> LINEOUT L
		cset "name='LOL Mux' Playback"
	]

	DisableSequence [
		cset "name='LOL Mux' Open"
		cset "name='ADDA_DL_CH1 DL1_CH1' 0"
		cset "name='ADDA_DL_CH2 DL1_CH2' 0"
	]

	Value {
		PlaybackPriority 400
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},${var:PlayDevN}"
	}
}

SectionDevice."Mic" {
	Comment "Analog microphone (MT6358 ADC, ACC mic)"

	EnableSequence [
		# MT6358 input chain: AINx -> PGA -> preamp -> ADC -> Mic Type Mux(ACC)
		# BOARD-UNVERIFIED AIN choice: AIN0 (L) / AIN1 (R). Confirm on hardware.
		cset "name='PGA L Mux' AIN0"
		cset "name='PGA R Mux' AIN1"
		cset "name='ADC L Mux' Left Preamplifier"
		cset "name='ADC R Mux' Right Preamplifier"
		cset "name='Mic Type Mux' ACC"
		cset "name='PGA Volume' 3"
		# AFE matrix: ADDA UL -> UL2 memif
		cset "name='UL2_CH1 ADDA_UL_CH1' 1"
		cset "name='UL2_CH2 ADDA_UL_CH2' 1"
		# --- digital-mic alternative (if the board wires a DMIC, use instead): ---
		#   cset "name='Mic Type Mux' DMIC"
		#   cset "name='MTKAIF_DMIC' 1"
		#   (and drop the PGA/ADC Mux csets above)
	]

	DisableSequence [
		cset "name='UL2_CH1 ADDA_UL_CH1' 0"
		cset "name='UL2_CH2 ADDA_UL_CH2' 0"
		cset "name='Mic Type Mux' Idle"
		cset "name='ADC L Mux' Idle"
		cset "name='ADC R Mux' Idle"
		cset "name='PGA L Mux' None"
		cset "name='PGA R Mux' None"
	]

	Value {
		CapturePriority 100
		CaptureChannels "${var:CapChanN}"
		CapturePCM "hw:${CardId},${var:CapDevN}"
	}
}
