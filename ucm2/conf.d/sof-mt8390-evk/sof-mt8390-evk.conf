# Genio 510 EVK (MT8188 / mt8390) - SOF analog playback via MT6359
# Card name: sof-mt8390-evk (ALSA short: sofmt8390evk)
# Card driver field (snd_ctl_card_info.driver): sof-mt8390-evk
# Platform driver (sysfs device/driver): mt8188_mt6359
# DT compatible: mediatek,mt8188-mt6359-evb / mediatek,mt8188
#
# alsa-lib resolves a hw card's UCM via conf.d/${CardDriver}/${CardDriver}.conf
# (ucm2/ucm.conf, "confd2"). The card's ALSA driver field is "sof-mt8390-evk",
# so THIS is the file alsa-lib loads for the real card. It pulls in the shared
# profile body (Define PlayDevN=16 + the HiFi verb + init).
Syntax 4
Include.profile.File "/MediaTek/sof-mt8390-evk/sof-mt8390-evk.conf"
