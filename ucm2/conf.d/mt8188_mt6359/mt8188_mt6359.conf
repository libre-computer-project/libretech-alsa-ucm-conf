# Fallback conf.d match point: card platform DRIVER == "mt8188_mt6359".
#
# On the Genio 510 EVK the ALSA card driver field is "sof-mt8390-evk" (set from
# the DT model), so the primary match is conf.d/sof-mt8390-evk/. But if the
# card's ALSA driver field is ever empty, alsa-lib falls back to the sysfs
# device/driver basename (readlink /sys/class/sound/card0/device/driver ==
# mt8188_mt6359) -- this entry covers that path. Same shared profile body.
Syntax 4
Include.profile.File "/MediaTek/sof-mt8390-evk/sof-mt8390-evk.conf"
