# Genio 500 / i500 (MT8183 / MT8385) - bare MT6358 internal-codec card.
# Card name: mt8183_mt6358
# Card driver field (snd_ctl_card_info.driver): mt8183_mt6358
# Platform driver (sysfs device/driver): mt8183_mt6358_ts3a227
# DT compatible: mediatek,mt8183-mt6358-sound
#
# alsa-lib resolves a hw card's UCM via conf.d/${CardDriver}/${CardDriver}.conf
# (ucm2/ucm.conf, "confd2"). The card's ALSA driver field is the sanitized card
# name "mt8183_mt6358", so THIS is the file alsa-lib loads for the real card.
# It pulls in the shared profile body (Define PlayDevN/CapDevN + HiFi + init).
Syntax 4
Include.profile.File "/MediaTek/mt8183_mt6358/mt8183_mt6358.conf"
