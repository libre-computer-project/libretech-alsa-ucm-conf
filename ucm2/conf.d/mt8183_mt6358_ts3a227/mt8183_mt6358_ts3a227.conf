# Platform-driver fallback match for the i500 bare MT6358 card.
# Some alsa-lib resolution paths key on the sysfs platform driver name
# (device/driver) rather than the ALSA card driver field. For this card the
# platform driver is "mt8183_mt6358_ts3a227" (platform_driver.driver.name in
# mt8183-mt6358-ts3a227-max98357.c). This entry covers that path; it pulls in
# the same shared profile body as conf.d/mt8183_mt6358/.
Syntax 4
Include.profile.File "/MediaTek/mt8183_mt6358/mt8183_mt6358.conf"
